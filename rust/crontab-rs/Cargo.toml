[package]
name = "crontab-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Rust port of `rust/reference/crontab/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/entry.rs"

[features]
default = ["bridge"]
bridge = ["dep:serde", "dep:serde_json", "dep:hex", "dep:tempfile"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
hex = { version = "0.4.3", optional = true }
tempfile = { version = "3.27.0", optional = true }

[target.'cfg(unix)'.dependencies]
filelock-rs = { path = "../filelock-rs", default-features = false }
nix = { version = "0.32", default-features = false, features = ["signal"] }
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4.3"
tempfile = "3.27.0"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
