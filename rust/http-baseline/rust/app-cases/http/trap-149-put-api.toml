[request]
method = "PUT"
path = "/api/h%C3%A9llo%20w%C3%B6rld"
body = '{"dir":"{project}","content":"# Fixture\nGREETING=\"hello world\"\n* * * * * printf \"%s\\n\" \"$GREETING\"\n@daily echo daily\n","revision":"stale","status":"allowed"}'

[request.headers]
X-Dashboard-Token = "fixture-valid-token"
X-Scenario-Step = "step-017-revision-conflict"

[response]
status = 404

[response.headers]
cache-control = "no-store"
content-security-policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'"
content-type = "text/plain; charset=utf-8"
referrer-policy = "no-referrer"
x-content-type-options = "nosniff"
