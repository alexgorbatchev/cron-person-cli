[package]
name = "filelock-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Rust port of `rust/reference/filelock/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/entry.rs"

[features]
default = ["bridge"]
bridge = ["dep:serde", "dep:serde_json", "dep:tempfile"]

[[bin]]
name = "filelock-probe"
path = "tests/support/probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_System_Diagnostics_Debug"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
