[package]
name = "display-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Rust port of `rust/reference/display/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/entry.rs"

[features]
default = ["bridge"]
bridge = []

[dependencies]
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
