[package]
name = "bootstrap-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Rust port of `rust/reference/bootstrap/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/entry.rs"

[features]
default = ["bridge"]
bridge = ["dep:serde", "dep:serde_json", "dep:hex"]

[dependencies]
unicode-general-category = "=0.6.0"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
hex = { version = "=0.4.3", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }
signal-hook = { version = "=0.3.18", default-features = false }

[[bin]]
name = "bootstrap-probe"
path = "src/probe.rs"
required-features = ["bridge"]

[[bin]]
name = "dev-bootstrap"
path = "src/main.rs"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
