[package]
name = "cron-person"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Front door for `cron-person`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "cron-person"
path = "src/main.rs"

[dependencies]
clap = "4"
hook-rs = { path = "../hook-rs", default-features = false }
filelock-rs = { path = "../filelock-rs", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
