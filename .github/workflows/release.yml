name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check module hygiene
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector and coverage
        run: |
          mkdir -p .tmp
          go test -race -covermode=atomic -coverprofile=.tmp/cover.out ./...

      - name: Enforce per-package coverage
        run: go tool go-test-coverage --config=.testcoverage.yml

      # Known vulnerabilities reachable from cron-person, in dependencies or
      # the standard library of the toolchain go.mod selects, fail the job.
      # govulncheck analyzes one operating system, so scan each released one.
      - name: Scan for known vulnerabilities
        run: |
          # Build the scanner for this machine, then point its analysis at each OS.
          vc="$(go tool -n govulncheck)" && for goos in linux darwin windows; do echo "GOOS=$goos"; GOOS=$goos "$vc" -show version ./... || exit 1; done

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
