name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check module hygiene
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage gate
        run: |
          mkdir -p .tmp
          go test -race -v -coverprofile=.tmp/coverage.out ./...
          coverage_profile=.tmp/coverage.out coverage_packages="$(go list ./...)" go run ./scripts/dev-bootstrap.go
