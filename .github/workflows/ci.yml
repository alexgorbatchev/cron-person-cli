name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: extractions/setup-just@v4

      # The generated-hook tests skip shells that are not installed; the
      # runner image lacks Fish and Zsh.
      - name: Install hook shells
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Check module hygiene
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The cron daemon test needs Docker and real cron minutes, so CI only
      # keeps it compiling.
      - name: Vet daemon integration test
        run: go vet -tags daemon ./cmd/cron-person

      - name: Test with the race detector and coverage
        run: just coverage

      # Known vulnerabilities reachable from cron-person, in dependencies or
      # the standard library of the toolchain go.mod selects, fail the job.
      # govulncheck analyzes one operating system, so scan each released one.
      - name: Scan for known vulnerabilities
        run: |
          # Build the scanner for this machine, then point its analysis at each OS.
          vc="$(go tool -n govulncheck)" && for goos in linux darwin windows; do echo "GOOS=$goos"; GOOS=$goos "$vc" -show version ./... || exit 1; done
